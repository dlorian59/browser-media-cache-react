name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: browser-media-cache-react
      - uses: actions/checkout@v4
        with:
          repository: 59Alex/browser-media-cache
          path: browser-media-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run bootstrap
        working-directory: browser-media-cache-react
      - run: npm test && npm run test:package
        working-directory: browser-media-cache-react
      - run: npx playwright install --with-deps chromium firefox
        working-directory: browser-media-cache-react
      - run: npm run test:browser
        working-directory: browser-media-cache-react
