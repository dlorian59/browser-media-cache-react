<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attachment gallery — interactive example</title>
<style>
  :root{font:15px/1.5 system-ui,sans-serif;color:#25323e;background:#f2f5f7;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:830px;margin:auto;border:1px solid #d7e0e5;border-radius:14px;background:white;padding:24px}
  h1{font-size:27px;margin:8px 0}.eyebrow{font-size:13px;color:#27655d;font-weight:600}p{color:#516170;margin:8px 0}.controls{display:flex;align-items:center;gap:10px;margin:20px 0 12px;flex-wrap:wrap}
  button{font:inherit;min-height:42px;border:1px solid #a5bbb6;border-radius:7px;background:#edf5f2;color:#24594f;padding:8px 14px;cursor:pointer}button:focus-visible{outline:3px solid #27796e;outline-offset:3px}
  .diagnostics{font-size:13px;border-block:1px solid #e2e8ed;padding:10px 0;margin:0 0 18px}section{min-height:385px}section>div{grid-template-columns:1fr 1fr!important}section figure:last-child{grid-column:1/-1}section figure:last-child>div{min-height:105px}section img{max-height:170px!important}.empty{padding:120px 0;text-align:center}footer{font-size:12px;color:#516170;border-top:1px solid #e2e8ed;margin-top:20px;padding-top:14px}
  @media(max-width:500px){body{padding:12px}main{padding:18px}section>div{grid-template-columns:1fr!important}h1{font-size:24px}}
</style><div id="app"></div><script type="module" src="/starter.js"></script></html>
